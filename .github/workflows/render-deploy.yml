name: Deploy to Render

# MANUAL ONLY (Actions → Deploy to Render → Run workflow). The automatic
# deploy-on-push trigger was removed 2026-08-02: auto-deploy stopped working
# reliably, so all production deploys are done by hand (normally from the
# Render dashboard; this workflow is a phone-friendly fallback).
# Requires ONE repository secret:
#   RENDER_DEPLOY_HOOK – the service's Deploy Hook URL, copied from
#     Render dashboard → your service → Settings → Deploy Hook.
# If the secret is absent the job is skipped, so this never breaks CI.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        id: gate
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "RENDER_DEPLOY_HOOK not set — skipping Render deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Render deploy hook
        if: steps.gate.outputs.ok == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # Render returns JSON like {"deploy":{"id":"dep-..."}} on success.
          resp=$(curl -sS -X POST -w '\n%{http_code}' "$HOOK")
          code=$(echo "$resp" | tail -1)
          body=$(echo "$resp" | head -n -1)
          echo "HTTP $code: $body"
          case "$code" in
            2*) echo "Render deploy triggered." ;;
            *)  echo "Deploy hook failed (HTTP $code)"; exit 1 ;;
          esac
